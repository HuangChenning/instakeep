<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">InstaKeep · IG 留存</title>
  <desc id="desc">Chrome 扩展把已打开的 Instagram 主页帖子，或当前帖子的图片、视频和轮播，直接写入选定文件夹。</desc>
  <defs>
    <clipPath id="frame">
      <rect width="1200" height="440" rx="28"/>
    </clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="440" fill="#F6F8F3"/>
    <rect width="12" height="440" fill="#215444"/>

    <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
      <text x="64" y="78" fill="#4A5C52" font-size="18" font-weight="600" letter-spacing="1.4">CHROME 扩展 · 本机文件夹</text>
      <text x="64" y="162" fill="#182825" font-size="68" font-weight="760" letter-spacing="-1.5">InstaKeep</text>
      <text x="64" y="208" fill="#215444" font-size="28" font-weight="600">IG 留存</text>
      <text x="64" y="268" fill="#182825" font-size="22">把打开的主页帖子，或当前这一条帖子，</text>
      <text x="64" y="302" fill="#182825" font-size="22">写入你选定的文件夹。</text>
      <text x="64" y="364" fill="#4A5C52" font-size="18" font-weight="600">图片 · 视频 · 轮播 · 本机文件夹</text>
    </g>

    <g id="folder-proof" transform="translate(688 48)">
      <rect x="28" y="0" width="176" height="42" rx="12" fill="#215444"/>
      <rect x="158" y="8" width="16" height="24" rx="3" fill="#D7A956"/>
      <text x="48" y="27" fill="#F6F8F3" font-size="18" font-weight="650" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">所选目录</text>
      <rect x="0" y="28" width="448" height="316" rx="20" fill="#FFFFFF" stroke="#215444" stroke-width="1.5"/>

      <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">
        <rect x="24" y="52" width="400" height="52" rx="8" fill="#F6F8F3"/>
        <text x="40" y="84" fill="#182825">{date}_{id}_01.jpg</text>
        <text x="352" y="84" fill="#4A5C52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="18">图片</text>

        <rect x="24" y="116" width="400" height="52" rx="8" fill="#F6F8F3"/>
        <text x="40" y="148" fill="#182825">{date}_{id}_02.jpg</text>
        <text x="352" y="148" fill="#4A5C52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="18">图片</text>

        <rect x="24" y="180" width="400" height="52" rx="8" fill="#F6F8F3"/>
        <text x="40" y="212" fill="#182825">{date}_{id}_03.jpg</text>
        <text x="352" y="212" fill="#4A5C52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="18">图片</text>
      </g>

      <rect x="24" y="248" width="400" height="72" rx="8" fill="#E7EFE8" stroke="#215444" stroke-width="1.5"/>
      <text x="40" y="278" fill="#182825" font-size="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">{date}_{id}_04.mp4</text>
      <text x="40" y="302" fill="#215444" font-size="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">视频</text>
    </g>
  </g>
</svg>
