<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">How InstaKeep saves</title>
  <desc id="desc">An open, signed-in Instagram page feeds a local extension queue, which writes files straight into the folder you chose.</desc>
  <rect width="1200" height="360" rx="28" fill="#F6F8F3"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <rect x="56" y="72" width="450" height="216" rx="20" fill="#FFFFFF" stroke="#D5DDD0" stroke-width="1.5"/>
    <text x="84" y="118" fill="#4A5C52" font-size="18" font-weight="700" letter-spacing="1.2">01</text>
    <text x="84" y="164" fill="#182825" font-size="32" font-weight="700">Signed-in page</text>
    <text x="84" y="208" fill="#182825" font-size="20">A profile, or the post open now</text>
    <text x="84" y="240" fill="#4A5C52" font-size="18">Only what this visit can open</text>
    <path d="M526 180 H560" fill="none" stroke="#215444" stroke-width="2"/>
    <path d="M548 172 L560 180 L548 188" fill="none" stroke="#215444" stroke-width="2"/>
    <rect x="572" y="108" width="210" height="144" rx="18" fill="#215444"/>
    <text x="596" y="154" fill="#D7A956" font-size="18" font-weight="700" letter-spacing="1.2">02</text>
    <text x="596" y="190" fill="#F6F8F3" font-size="24" font-weight="700">Local queue</text>
    <text x="596" y="220" fill="#E7EFE8" font-size="18">Skip, pause, retry</text>
    <path d="M802 180 H836" fill="none" stroke="#215444" stroke-width="2"/>
    <path d="M824 172 L836 180 L824 188" fill="none" stroke="#215444" stroke-width="2"/>
    <rect x="848" y="48" width="296" height="264" rx="20" fill="#FFFFFF" stroke="#215444" stroke-width="2"/>
    <rect x="872" y="48" width="188" height="32" rx="8" fill="#215444"/>
    <rect x="1028" y="56" width="12" height="16" rx="2" fill="#D7A956"/>
    <text x="886" y="70" fill="#F6F8F3" font-size="18" font-weight="650">Chosen folder</text>
    <text x="876" y="132" fill="#4A5C52" font-size="18" font-weight="700" letter-spacing="1.2">03</text>
    <text x="876" y="176" fill="#182825" font-size="28" font-weight="700">Direct write</text>
    <text x="876" y="218" fill="#182825" font-size="20">Media and source JSON</text>
    <text x="876" y="256" fill="#4A5C52" font-size="18">Same names are kept</text>
  </g>
</svg>
